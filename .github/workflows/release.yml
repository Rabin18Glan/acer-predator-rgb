name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools shellcheck
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "acer-predator-rgb") | .version')
          [[ "$TAG" == "v$version" ]] || { echo "Tag $TAG does not match Cargo.toml v$version"; exit 1; }
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build portable Linux binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/acer-predator-rgb --help
      - name: Package and test installer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/package-release.sh "$TAG"
          for script in install.sh scripts/package-release.sh tests/install.sh tests/fixtures/curl tests/fixtures/uname; do bash -n "$script"; done
          shellcheck install.sh scripts/package-release.sh tests/install.sh tests/fixtures/curl tests/fixtures/uname
          bash tests/install.sh target/x86_64-unknown-linux-musl/release/acer-predator-rgb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: dist
      - name: Publish release with binaries and installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            [[ $(jq -r .isDraft release.json) == true ]] || { echo 'Release already published; refusing to overwrite.'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "acer-predator-rgb $TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
